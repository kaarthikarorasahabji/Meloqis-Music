name: Notification delivery check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meloqis-notification-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check scheduled notifications
        env:
          DISPATCH_SECRET: ${{ secrets.MELOQIS_DISPATCH_SECRET }}
        run: |
          test -n "$DISPATCH_SECRET"
          curl --fail-with-body --silent --show-error --connect-timeout 15 --max-time 75 \
            --request POST 'https://admin.axenoraai.in/api/dispatch' \
            --header "Authorization: Bearer $DISPATCH_SECRET" \
            --header 'Content-Type: application/json' --data '{}'
