name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Optional successful build run to publish without rebuilding
        required: false
        default: ''
      release_tag:
        description: Release tag for an existing successful build
        required: false
        default: v1.7.0

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    name: Validate Android release
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - name: Prepare release signing keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meloqis-release.jks"
          chmod 600 "$RUNNER_TEMP/meloqis-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/meloqis-release.jks" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :composeApp:testAndroidHostTest --no-configuration-cache --console=plain -x :androidApp:uploadCrashlyticsMappingFileRelease
      - name: Verify signed release APKs
        if: ${{ env.RELEASE_KEYSTORE_PATH != '' }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-universal-release.apk)"
          printf '%s\n' "$cert_output"
          # Existing v1.5.0 installs trust this certificate; reject an incompatible update key.
          grep -Fq 'certificate SHA-256 digest: 24be20817821f8c532c6f7289d358d0460b9862c5e5ef627802ed92498aa904b' <<< "$cert_output"
      - name: Verify capture and outside-app lighting permissions are absent
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump permissions androidApp/build/outputs/apk/release/androidApp-universal-release.apk > "$RUNNER_TEMP/permissions.txt"
          if grep -Eq "android.permission.(CAMERA|FOREGROUND_SERVICE_CAMERA|RECORD_AUDIO|SYSTEM_ALERT_WINDOW|FOREGROUND_SERVICE_SPECIAL_USE)" "$RUNNER_TEMP/permissions.txt"; then exit 1; fi
          if unzip -l androidApp/build/outputs/apk/release/androidApp-universal-release.apk | grep -qi 'libmediapipe'; then exit 1; fi
      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-release-apks-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/*.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-test-results
          path: composeApp/build/test-results/testAndroidHostTest/
  play-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id == ''
    name: Build Play bundle for offline signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - name: Build unsigned Play bundle
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:bundleRelease -PplayStore=true --no-configuration-cache --console=plain -x :androidApp:uploadCrashlyticsMappingFileRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Meloqis-play-unsigned-${{ github.sha }}
          path: |
            androidApp/build/outputs/bundle/release/*.aab
            androidApp/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
  device-check:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run_id == ''
    name: Check native streaming on Android 13
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - name: Build device test
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest -PstreamingProbe=true --no-configuration-cache --console=plain
      - name: Start cloud Android device and verify playback
        run: |
          image='system-images;android-33;google_apis;x86_64'
          sdkmanager --install 'emulator' "$image"
          avdmanager create avd --force --name MeloqisCI --package "$image" <<< no
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd MeloqisCI -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 180 adb wait-for-device
          for attempt in {1..90}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          apk="$(find androidApp/build/outputs/apk/debug -name '*x86_64*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then apk="$(find androidApp/build/outputs/apk/debug -name '*.apk' -print -quit)"; fi
          test_apk="$(find androidApp/build/outputs/apk/androidTest/debug -name '*.apk' -print -quit)"
          adb install "$apk"
          adb install "$test_apk"
          timeout 100 adb shell am instrument -w echo.music.iad1tya.test/echo.music.iad1tya.test.StreamingPlaybackProbe | tee streaming-probe.txt
          grep -F 'STREAMING_OK:' streaming-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meloqis-device-check
          path: |
            emulator.log
            streaming-probe.txt
  publish-verified-build:
    if: ${{ inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Select the successful source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" = success
          source_sha=$(gh run view "$BUILD_RUN_ID" --json headSha --jq .headSha)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Meloqis-release-apks-${{ steps.source.outputs.sha }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: androidApp/build/outputs/apk/release
      - name: Prepare and inspect release files
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/prepare-release-assets.py "$RELEASE_TAG"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for apk in Path('build/publish-release').glob('*.apk'):
              with ZipFile(apk) as archive:
                  assert not any('mediapipe' in name.lower() for name in archive.namelist()), apk.name
          PY
      - name: Publish the verified update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" build/publish-release/* --target "$SOURCE_SHA" --title "Meloqis Music ${RELEASE_TAG#v}" --notes-file docs/RELEASE-1.7.0.md
