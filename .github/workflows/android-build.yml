name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :composeApp:testAndroidHostTest --no-configuration-cache --console=plain -x :androidApp:uploadCrashlyticsMappingFileRelease
      - name: Upload unsigned CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-unsigned-ci-apks
          path: androidApp/build/outputs/apk/release/*.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-test-results
          path: composeApp/build/test-results/testAndroidHostTest/
