name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Optional successful build run to publish without rebuilding
        required: false
        default: ''
      release_tag:
        description: Release tag for an existing successful build
        required: false
        default: v1.7.0

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    name: Validate Android release
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - name: Prepare release signing keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meloqis-release.jks"
          chmod 600 "$RUNNER_TEMP/meloqis-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/meloqis-release.jks" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :composeApp:testAndroidHostTest --no-configuration-cache --console=plain -x :androidApp:uploadCrashlyticsMappingFileRelease
      - name: Verify signed release APKs
        if: ${{ env.RELEASE_KEYSTORE_PATH != '' }}
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          cert_output="$("$apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-universal-release.apk)"
          printf '%s\n' "$cert_output"
          # Existing v1.5.0 installs trust this certificate; reject an incompatible update key.
          grep -Fq 'certificate SHA-256 digest: 24be20817821f8c532c6f7289d358d0460b9862c5e5ef627802ed92498aa904b' <<< "$cert_output"
      - name: Verify camera and microphone access are absent
        run: |
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -n "$aapt"
          "$aapt" dump permissions androidApp/build/outputs/apk/release/androidApp-universal-release.apk > "$RUNNER_TEMP/permissions.txt"
          if grep -Eq "android.permission.(CAMERA|FOREGROUND_SERVICE_CAMERA|RECORD_AUDIO)" "$RUNNER_TEMP/permissions.txt"; then exit 1; fi
          if unzip -l androidApp/build/outputs/apk/release/androidApp-universal-release.apk | grep -qi 'libmediapipe'; then exit 1; fi
      - name: Upload release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-release-apks-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/*.apk
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-test-results
          path: composeApp/build/test-results/testAndroidHostTest/
  publish-verified-build:
    if: ${{ inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Select the successful source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(gh run view "$BUILD_RUN_ID" --json conclusion --jq .conclusion)" = success
          source_sha=$(gh run view "$BUILD_RUN_ID" --json headSha --jq .headSha)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: Meloqis-release-apks-${{ steps.source.outputs.sha }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: androidApp/build/outputs/apk/release
      - name: Prepare and inspect release files
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 scripts/prepare-release-assets.py "$RELEASE_TAG"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for apk in Path('build/publish-release').glob('*.apk'):
              with ZipFile(apk) as archive:
                  assert not any('mediapipe' in name.lower() for name in archive.namelist()), apk.name
          PY
      - name: Publish the verified update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" build/publish-release/* --target "$SOURCE_SHA" --title "Meloqis Music ${RELEASE_TAG#v}" --notes-file docs/RELEASE-1.7.0.md
