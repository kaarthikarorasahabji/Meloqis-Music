name: Maintain latest app download

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag
        required: true
      default: v1.5.1

permissions:
  contents: write

jobs:
  universal-download:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the stable universal APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          count=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[] | select(.name | endswith("-universal.apk"))] | length')
          test "$count" = "1"
          gh release download "$RELEASE_TAG" --pattern '*-universal.apk' --dir apk
          cp apk/*-universal.apk Meloqis-Music-latest.apk
          gh release upload "$RELEASE_TAG" Meloqis-Music-latest.apk --clobber
