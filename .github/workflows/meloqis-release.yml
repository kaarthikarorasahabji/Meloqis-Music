name: Publish Meloqis release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app version
        required: true
        default: v1.7.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Prepare existing update key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meloqis-release.jks"
          chmod 600 "$RUNNER_TEMP/meloqis-release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/meloqis-release.jks" >> "$GITHUB_ENV"
      - name: Build and test all Android architectures
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease :domain:jvmTest :composeApp:testAndroidHostTest --no-configuration-cache --console=plain -x :androidApp:uploadCrashlyticsMappingFileRelease
      - name: Verify update signing identity
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs androidApp/build/outputs/apk/release/androidApp-universal-release.apk > "$RUNNER_TEMP/certificate.txt"
          grep -Fq 'certificate SHA-256 digest: 24be20817821f8c532c6f7289d358d0460b9862c5e5ef627802ed92498aa904b' "$RUNNER_TEMP/certificate.txt"
      - name: Prepare device downloads
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/prepare-release-assets.py "$RELEASE_TAG"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Meloqis-${{ inputs.tag }}
          path: build/publish-release/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" build/publish-release/* --target "$GITHUB_SHA" --title "Meloqis Music ${RELEASE_TAG#v}" --notes-file docs/RELEASE-1.7.0.md
